apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-manager1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: student-task-manager1
  template:
    metadata:
      labels:
        app: student-task-manager1
    spec:
      containers:
        - name: student-task-manager1
          image: task-manager:2.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
